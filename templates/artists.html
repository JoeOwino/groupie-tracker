<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <link rel="stylesheet" href="/static/artists.css">
</head>
<body>
    <h1>Artists</h1>
    <div class="artists-container">
        {{range .}}
        <div class="artist-card">
            <img id="{{.ArtistID}}" src="{{.ArtistImage}}" alt="Artist Image">
            <div class="artist-details">
                <h2>{{.ArtistName}}</h2>
                <p>Started: {{.CreationDate}}</p>
                <p>First Album: {{.FirstAlbum}}</p>
                <!-- Details button -->
                <a href="/details?id={{.ArtistID}}" class="details-button">Details</a>
            </div>
        </div>
        {{end}}
    </div>
    <footer>
        <p>&copy; 2024 Groupie Tracker. All rights reserved.</p>
    </footer>
</body>
</html>
