<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Artists</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        async function fetchSuggestions() {
            const query = document.getElementById('search-input').value;
            if (query.length < 1) {
                document.getElementById('suggestions').innerHTML = '';
                return;
            }
            const response = await fetch(`/search?query=${query}`);
            const suggestions = await response.json();
            const suggestionsList = document.getElementById('suggestions');
            suggestionsList.innerHTML = '';

            suggestions.forEach(suggestion => {
                const li = document.createElement('li');
                const link = document.createElement('a');
                link.href = `/details?name=${encodeURIComponent(suggestion)}`; // Assuming you have a details page
                link.textContent = suggestion;
                li.appendChild(link);
                suggestionsList.appendChild(li);
            });
        }
    </script>
</head>
<body>
    <h1>Search for Artists</h1>
    <input type="text" id="search-input" onkeyup="fetchSuggestions()" placeholder="Search for artists, members, etc.">
    <ul id="suggestions"></ul>
</body>
</html>
